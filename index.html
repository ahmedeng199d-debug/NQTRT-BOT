<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NQTRT TRADING - منصة التداول والتحليل</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --panel-bg: #151a21;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --border-color: #2b313a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        h1 { font-size: 24px; color: var(--accent-green); letter-spacing: 1px; }
        .container { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        .card h2 { font-size: 18px; margin-bottom: 15px; color: var(--text-main); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px; }
        button { width: 100%; padding: 12px; background: var(--accent-green); border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .trades-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }
        .trade-item { background: var(--bg-color); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .trade-info h4 { font-size: 15px; margin-bottom: 4px; }
        .trade-info p { font-size: 12px; color: var(--text-muted); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge.buy { background: rgba(14, 203, 129, 0.2); color: var(--accent-green); }
        .badge.sell { background: rgba(246, 70, 93, 0.2); color: var(--accent-red); }
    </style>
</head>
<body>

    <header>
        <h1>NQTRT TRADING</h1>
        <div id="status" style="font-size: 13px; color: var(--accent-green);">● متصل بقاعدة البيانات</div>
    </header>

    <div class="container">
        <!-- لوحة إضافة صفقة جديدة -->
        <div class="card">
            <h2>إضافة صفقة / إشارة جديدة</h2>
            <form id="tradeForm">
                <div class="form-group">
                    <label>الزوج / الأصل (مثل NQ / XAUUSD)</label>
                    <input type="text" id="symbol" required placeholder="مثال: NQ1!">
                </div>
                <div class="form-group">
                    <label>نوع الصفقة</label>
                    <select id="type">
                        <option value="BUY">شراء (BUY)</option>
                        <option value="SELL">بيع (SELL)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>سعر الدخول</label>
                    <input type="number" step="any" id="entry" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>الهدف (TP)</label>
                    <input type="number" step="any" id="tp" required placeholder="0.00">
                </div>
                <button type="submit">حفظ ونشر الصفقة</button>
            </form>
        </div>

        <!-- لوحة عرض الصفقات -->
        <div class="card">
            <h2>سجل الصفقات المباشرة</h2>
            <div id="tradesList" class="trades-list">
                <p style="color: var(--text-muted); text-align: center; padding: 20px;">جاري جلب الصفقات...</p>
            </div>
        </div>
    </div>

    <!-- ربط الـ Firebase والتشغيل -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBm_3bzAdskTHP_sbmCeoUxYt2nFXxANpE",
            authDomain: "nqtrt-trading.firebaseapp.com",
            projectId: "nqtrt-trading",
            storageBucket: "nqtrt-trading.firebasestorage.app",
            messagingSenderId: "111810460431",
            appId: "1:111810460431:web:48c844c874e5896af85c7a",
            measurementId: "G-6CJFTXJV1Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tradeForm = document.getElementById('tradeForm');
        const tradesList = document.getElementById('tradesList');

        tradeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const symbol = document.getElementById('symbol').value.toUpperCase();
            const type = document.getElementById('type').value;
            const entry = document.getElementById('entry').value;
            const tp = document.getElementById('tp').value;

            try {
                await addDoc(collection(db, "trades"), {
                    symbol, type, entry, tp,
                    timestamp: new Date()
                });
                tradeForm.reset();
                loadTrades();
            } catch (error) {
                console.error("خطأ أثناء الإضافة: ", error);
            }
        });

        async function loadTrades() {
            tradesList.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">جاري التحديث...</p>';
            try {
                const querySnapshot = await getDocs(collection(db, "trades"));
                tradesList.innerHTML = '';
                
                if (querySnapshot.empty) {
                    tradesList.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">لا توجد صفقات حالياً</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const t = doc.data();
                    const badgeClass = t.type === 'BUY' ? 'buy' : 'sell';
                    tradesList.innerHTML += `
                        <div class="trade-item">
                            <div class="trade-info">
                                <h4>${t.symbol}</h4>
                                <p>الدخول: ${t.entry} | الهدف: ${t.tp}</p>
                            </div>
                            <span class="badge ${badgeClass}">${t.type}</span>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("خطأ في الجلب: ", error);
                tradesList.innerHTML = '<p style="color: var(--accent-red); text-align: center; padding: 20px;">فشل في الاتصال بقاعدة البيانات</p>';
            }
        }

        loadTrades();
    </script>
</body>
</html>
